<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards - Tests</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 40px 16px;
    }

    h1 { margin: 0 0 4px; }
    #summary { margin: 0 0 24px; color: #555; }

    /* One row per test rule */
    .row {
      background: #fff;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 12px;
      max-width: 640px;
      border-left: 6px solid #ccc;
    }
    .row.pass { border-left-color: #28a745; }
    .row.fail { border-left-color: #dc3545; }

    /* PASS / FAIL badge */
    .badge {
      display: inline-block;
      min-width: 56px;
      text-align: center;
      color: #fff;
      font-weight: bold;
      border-radius: 4px;
      padding: 3px 8px;
      margin-right: 10px;
    }
    .pass .badge { background: #28a745; }
    .fail .badge { background: #dc3545; }

    .name { font-weight: bold; }
    .detail { display: block; color: #555; font-size: 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Dutch Flashcards - Tests</h1>
  <p id="summary">Running...</p>
  <div id="results"></div>

  <script src="words.js"></script>
  <script src="round.js"></script>
  <script>
    // Show one rule as PASS (green) or FAIL (red)
    function report(ok, name, detail) {
      var row = document.createElement("div");
      row.className = "row " + (ok ? "pass" : "fail");
      row.innerHTML =
        '<span class="badge">' + (ok ? "PASS" : "FAIL") + "</span>" +
        '<span class="name"></span><span class="detail"></span>';
      row.querySelector(".name").textContent = name;
      row.querySelector(".detail").textContent = detail;
      document.getElementById("results").appendChild(row);
      return ok;
    }

    var allOk = true;

    // Guard: words.js and round.js must have loaded
    if (typeof WORDS === "undefined" || typeof pickRound === "undefined" ||
        typeof checkAnswer === "undefined" || typeof recordAnswer === "undefined" ||
        typeof resetCounters === "undefined") {
      report(false, "Setup", "words.js or round.js failed to load.");
    } else {

      // --- Rule 1: every entry has a non-empty Dutch word, a valid type and an English translation ---
      var TYPES = ["noun", "verb", "adjective", "adverb", "preposition",
                   "pronoun", "conjunction", "other"];
      var bad = [];
      for (var i = 0; i < WORDS.length; i++) {
        var w = WORDS[i] || {};
        var en = w.translations ? String(w.translations.en || "").trim() : "";
        if (!String(w.nl || "").trim() || TYPES.indexOf(w.type) === -1 || !en) {
          bad.push("entry " + i + " (" + (w.nl || "?") + ")");
        }
      }
      allOk = report(
        bad.length === 0,
        "1. Every entry has a non-empty Dutch word, a valid type and an English translation",
        bad.length === 0
          ? "All " + WORDS.length + " entries have a word, a type and English."
          : "Problem in: " + bad.join(", ")
      );

      // --- Rule 2: no duplicate Dutch words ---
      var seen = {};
      var dups = [];
      for (var i = 0; i < WORDS.length; i++) {
        var nl = String((WORDS[i] || {}).nl || "");
        if (seen[nl]) dups.push(nl);
        seen[nl] = true;
      }
      allOk = report(
        dups.length === 0,
        "2. No duplicate Dutch words",
        dups.length === 0
          ? "All " + WORDS.length + " Dutch words are unique."
          : "Duplicates: " + dups.join(", ")
      ) && allOk;

      // --- Rule 3: every translation key exists in "languages" ---
      var unknown = [];
      if (typeof LANGUAGES === "undefined") {
        unknown.push("LANGUAGES is missing from words.js");
      } else {
        for (var i = 0; i < WORDS.length; i++) {
          var translations = (WORDS[i] || {}).translations || {};
          var keys = Object.keys(translations);
          for (var k = 0; k < keys.length; k++) {
            if (!LANGUAGES[keys[k]]) {
              unknown.push(((WORDS[i] || {}).nl || "?") + " -> " + keys[k]);
            }
          }
        }
      }
      allOk = report(
        unknown.length === 0,
        "3. Every translation key exists in \"languages\"",
        unknown.length === 0
          ? "All translation keys are declared in LANGUAGES."
          : "Unknown language key: " + unknown.join(", ")
      ) && allOk;

      // --- Rule 4: a round always has exactly 20 words, no duplicates ---
      var roundError = "";
      if (WORDS.length < 20) {
        roundError = "Word bank has only " + WORDS.length + " words (need 20).";
      } else {
        for (var t = 0; t < 100 && !roundError; t++) {
          var round = pickRound(20);
          if (round.length !== 20) {
            roundError = "Round " + (t + 1) + " had " + round.length + " words.";
            break;
          }
          var inRound = {};
          for (var i = 0; i < round.length; i++) {
            var nl = String((round[i] || {}).nl || "");
            if (inRound[nl]) {
              roundError = "Round " + (t + 1) + " repeats '" + nl + "'.";
              break;
            }
            inRound[nl] = true;
          }
        }
      }
      allOk = report(
        roundError === "",
        "4. A new round has exactly 20 words, no duplicates",
        roundError === "" ? "100 rounds tested, each with 20 unique words." : roundError
      ) && allOk;

      // --- Rule 5: options are always 4 unique English translations with exactly one correct ---
      var optionError = "";
      for (var i = 0; i < WORDS.length && !optionError; i++) {
        var word = WORDS[i] || {};
        var answer = String((word.translations || {}).en || "");
        var options = buildOptions(word);

        if (options.length !== 4) {
          optionError = (word.nl || "?") + " gave " + options.length + " options.";
        } else {
          var unique = [];
          for (var j = 0; j < options.length; j++) {
            if (unique.indexOf(options[j]) === -1) unique.push(options[j]);
          }
          if (unique.length !== options.length) {
            optionError = (word.nl || "?") + " has duplicate options.";
          } else if (unique.indexOf(answer) === -1) {
            optionError = (word.nl || "?") + " has no correct option.";
          }
        }
      }
      allOk = report(
        optionError === "",
        "5. Options are always 4 unique English translations with exactly one correct",
        optionError === ""
          ? "All " + WORDS.length + " words give 4 unique options with exactly one correct."
          : optionError
      ) && allOk;

      // --- Rule 6: a correct pick raises the correct counter by one; a wrong pick raises the wrong counter ---
      var counterError = "";
      var first = WORDS[0] || {};

      // A correct pick
      resetCounters();
      recordAnswer(checkAnswer(first, first.translations.en));
      if (counters.correct !== 1 || counters.wrong !== 0) {
        counterError = "Correct pick gave " + counters.correct +
                       " correct / " + counters.wrong + " wrong.";
      }

      // A wrong pick (any option that is not the answer)
      if (!counterError) {
        var options = buildOptions(first);
        var wrongPick = "";
        for (var i = 0; i < options.length; i++) {
          if (options[i] !== first.translations.en) { wrongPick = options[i]; break; }
        }
        resetCounters();
        recordAnswer(checkAnswer(first, wrongPick));
        if (counters.wrong !== 1 || counters.correct !== 0) {
          counterError = "Wrong pick gave " + counters.correct +
                         " correct / " + counters.wrong + " wrong.";
        }
      }

      resetCounters();           // leave the shared counters clean
      allOk = report(
        counterError === "",
        "6. A correct pick raises the correct counter by one; a wrong pick raises the wrong counter",
        counterError === ""
          ? "Correct pick: 1 correct; wrong pick: 1 wrong."
          : counterError
      ) && allOk;
    }

    // Overall summary line
    document.getElementById("summary").textContent =
      allOk ? "All tests passed." : "Some tests FAILED.";
  </script>
</body>
</html>
